<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar eliminación de autor</title>
</head>
<body>
    <h1>Biblioteca</h1>
    <h2>Confirmar eliminación del autor</h2>
    <p>¿Estás seguro de que deseas eliminar el autor "{{ autor.nombre }}"?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Eliminar</button>
        <a href="{% url 'autor_list' %}">Cancelar</a>
    </form>
</body>
</html>
