<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if formulario.instance.pk %}Editar autor{% else %}Crear autor{% endif %}</title>
</head>
<body>
    <h1>{% if formulario.instance.pk %}Editar autor{% else %}Crear autor{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ formulario.as_p }}
        <button type="submit">Guardar</button>
    </form>
    <a href="{% url 'autor_list' %}">Volver a autores</a>
</body>
</html>
