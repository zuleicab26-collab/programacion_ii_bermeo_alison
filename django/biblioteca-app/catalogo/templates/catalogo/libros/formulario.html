<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if formulario.instance.pk %} Editar libro {% else %} Crear libro {% endif %}</title>
</head>
<body>
    <h1>{% if formulario.instance.pk %}Editar Libro{% else %}Crear Libro{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {% for campo in formulario %}
        <p>
            {{ campo.label_tag }}
            {{ campo }}
            {{ campo.errors }}
        </p>
        {% endfor %}
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
